[package]
name = "backend"
version = "0.1.0"
edition = "2021"
authors = ["Inwerejosic", "inwerejosic@protonmail.com"]

[dependencies]
actix-cors = "0.7.1"
actix-web = "4.12.1"

diesel = { version = "2.2", features = ["chrono", "r2d2", "sqlite"] }
libsqlite3-sys = { version = "*", features = ["bundled"] }
dotenv = "0.15.0"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
chrono = { version = "0.4.42", features = ["serde"] }


# For the Authentication Functionalities
bcrypt = "0.15"
jsonwebtoken = "9.3"

[[bin]]
name = "backend"
path = "src/main.rs"
